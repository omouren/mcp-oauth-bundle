services:
    _defaults:
        autowire: true
        autoconfigure: true

    Omouren\McpOauthBundle\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/McpOauthBundle.php'
            - '../src/McpOauthSettings.php'
            - '../src/Cimd/CimdException.php'
            - '../src/Cimd/ClientIdMetadataDocument.php'
            - '../src/OAuth/ResourceBoundAccessToken.php'

    Omouren\McpOauthBundle\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Resolves the host before connecting and rejects private and loopback IPs, so a public DNS name
    # that points inside the network is blocked too.
    mcp_oauth.cimd_http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

    Omouren\McpOauthBundle\Cimd\ClientIdMetadataResolver:
        arguments:
            $httpClient: '@mcp_oauth.cimd_http_client'
            $cache: '@cache.app'

    Omouren\McpOauthBundle\OAuth\LeagueClientSynchronizer:
        arguments:
            $clientManager: '@?League\Bundle\OAuth2ServerBundle\Manager\ClientManagerInterface'
            $passwordHasher: '@?league.oauth2_server.password_hasher'
